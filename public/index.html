<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
	</head>

	<body>
		<h1>Hello World</h1>

		<div id="db"></div>
		
		<script>
			async function getDataFromDb() {
				const response = await fetch("/api/get-song-db");
				const items = await response.json();
				// 取得したjsonをそのまま表示
				document.getElementById("db").innerText = JSON.stringify(items, null, 2);
			}

			getDataFromDb();
		</script>
	</body>
</html>
