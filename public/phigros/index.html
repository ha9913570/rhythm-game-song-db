<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="./index.css">
	<script src="./get_phigros_song.js"></script>
</head>

<!-- 表の要素をクリックしたときに表示するモーダル -->
<div id="song-detail-modal" class="modal-overlay" onclick="if(event.target===this) closeSongDetail()">
	<div class="modal-content">
		<span class="modal-close" onclick="closeSongDetail()">×</span>
		<h2 id="detail-song-name"></h2>
		<table>
			<tr>
				<th>作曲者名</th>
				<td id="detail-composer-name"></td>
			</tr>
			<tr>
				<th>チャプター名</th>
				<td id="detail-chapter-name"></td>
			</tr>
			<tr>
				<th>BPM</th>
				<td id="detail-bpm"></td>
			</tr>
			<tr>
				<th>長さ</th>
				<td id="detail-song-length"></td>
			</tr>
			<tr>
				<th>難易度(EZ)</th>
				<td id="detail-diff-ez"></td>
			</tr>
			<tr>
				<th>難易度(HD)</th>
				<td id="detail-diff-hd"></td>
			</tr>
			<tr>
				<th>難易度(IN)</th>
				<td id="detail-diff-in"></td>
			</tr>
			<tr>
				<th>難易度(AT)</th>
				<td id="detail-diff-at"></td>
			</tr>
			<tr>
				<th>ノーツ数(EZ)</th>
				<td id="detail-note-ez"></td>
			</tr>
			<tr>
				<th>ノーツ数(HD)</th>
				<td id="detail-note-hd"></td>
			</tr>
			<tr>
				<th>ノーツ数(IN)</th>
				<td id="detail-note-in"></td>
			</tr>
			<tr>
				<th>ノーツ数(AT)</th>
				<td id="detail-note-at"></td>
			</tr>
			<tr>
				<th>追加バージョン</th>
				<td id="detail-add-version"></td>
			</tr>
		</table>
	</div>
</div>

<body>
	<h1>Phigros</h1>

	<div>バージョン<span id="latest-version"></span>までの情報を表示しています。</div>

	<!-- 検索ボックス -->
	<table>
		<tr>
			<th>曲名で検索</th>
			<th>
				<input type="text" id="search-song-name">
			</th>
		</tr>
		<tr>
			<th>作曲者名で検索</th>
			<th>
				<input type="text" id="search-composer-name">
			</th>
		</tr>
		<tr>
			<th>チャプター名で検索</th>
			<th>
				<input type="text" id="search-chapter-name">
			</th>
		</tr>
	</table>
	<input type="button" value="検索" onclick="getPhigrosDataFromDb()">
	<input type="button" value="クリア" onclick="clearSearchParam()">

	<br>

	<!-- 並べ替え -->
	<table>
		<tr>
			<th>並べ替え対象</th>
			<th>
				<select id="sort-type" onChange="getPhigrosDataFromDb()">
					<option value="song-name">曲名</option>
					<option value="composer-name">作曲者名</option>
					<option value="chapter-name">チャプター名</option>
					<option value="bpm">BPM</option>
					<option value="song-length">長さ</option>
					<option value="add-version" selected>追加バージョン</option>
				</select>
			</th>
			<th>順番</th>
			<th>
				<select id="order-by" onChange="getPhigrosDataFromDb()">
					<option value="asc" selected>昇順</option>
					<option value="desc">降順</option>
				</select>
			</th>
		</tr>
	</table>

	<br>

	<p><span id="column-num"></span>件のデータを表示しています。</p>
	<p>クリックすることで詳細を表示できます。</p>

	<!-- データベースのデータ -->
	<div id="song-list-wrapper">
		<table id="song-list" , border="1"></table>
	</div>

	<p>このサイトは<a href="https://wikiwiki.jp/phigros/">Phigros Wiki</a>を参考にデータを作成・表示しています。</p>

	<script>
		getPhigrosDataFromDb();
		getLatestVersion();
	</script>
</body>

</html>
