<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<link rel="stylesheet" href="./index.css">
		<script src="./get_phigros_song.js"></script>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Saira:wght@100..900&display=swap&text=0123456789" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
	</head>

	<body>
		<h1>Phigros</h1>

		<!-- 検索ボックス -->
		<table>
			<tr>
				<th>曲名で検索</th>
				<th>
					<input type="text" id="search-song-name">
				</th>
			</tr>
			<tr>
				<th>作曲者名で検索</th>
				<th>
					<input type="text" id="search-composer-name">
				</th>
			</tr>
			<tr>
				<th>チャプター名で検索</th>
				<th>
					<input type="text" id="search-chapter-name">
				</th>
			</tr>
		</table>
		<input type="button" value="検索">

		<br>

		<!-- 並べ替え -->
		<table>
			<tr>
				<th>並べ替え対象</th>
				<th>
					<select id="sort_type" onChange="getDataFromDb()">
						<option value="song_name">曲名</option>
						<option value="composer_name">作曲者名</option>
						<option value="chapter_name">チャプター名</option>
						<option value="bpm">BPM</option>
						<option value="song_length">長さ</option>
						<option value="add_version" selected>追加バージョン</option>
					</select>
				</th>
				<th>順番</th>
				<th>
					<select id="order_by" onChange="getDataFromDb()">
						<option value="asc" selected>昇順</option>
						<option value="desc">降順</option>
					</select>
				</th>
			</tr>
		</table>

		<br>

		<!-- データベースのデータ -->
		<table id="song_list", border="1", style="border-collapse: collapse"></table>
		
		<script>
			getDataFromDb();
		</script>
	</body>
</html>
